<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta name="theme-color" content="#0b1f3a">
    <meta name="format-detection" content="telephone=no">

    <title>Schwab</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="unnamed.png">
    <link rel="apple-touch-icon" href="tallyup.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-root">
        <div id="login-screen" class="screen login-screen">
            <div class="login-shell">
                <div class="login-header">
                    <div class="brand-mark" aria-label="Schwab">S</div>
                    <span class="eyebrow">Schwab Brokerage</span>
                    <h1>Welcome back, Nik</h1>
                    <p></p>
                </div>

                <form id="login-form" class="login-form">
                    <div class="input-group">
                        <label for="login-email">Schwab ID</label>
                        <input type="text" id="login-email" placeholder="Email or Login ID" autocomplete="username" required>
                    </div>
                    <div class="input-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
                    </div>
                    <button type="submit" id="login-btn" class="primary-button login-button">Log In</button>
                    <div class="login-options">
                        <a href="#" id="forgot-password">Forgot password?</a>
                    </div>
                </form>
            </div>
        </div>

        <div id="privacy-overlay" class="overlay hidden" aria-hidden="true">
            <div class="privacy-content">
                <div class="brand-mark">S</div>
                <strong>Privacy Mode</strong>
                <span>Return to the app to continue.</span>
            </div>
        </div>

        <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

        <nav id="bottom-nav" class="bottom-nav hidden" aria-label="Primary">
            <button class="nav-item active" data-route="dashboard">
                <span class="nav-icon">⌂</span><span>Accounts</span>
            </button>
            <button class="nav-item" data-route="positions">
                <span class="nav-icon">▤</span><span>Positions</span>
            </button>
            <button class="nav-item" data-route="trade">
                <span class="nav-icon">＋</span><span>Trade</span>
            </button>
            <button class="nav-item" data-route="transfers">
                <span class="nav-icon">⇄</span><span>Move Money</span>
            </button>
            <button class="nav-item" data-route="markets">
                <span class="nav-icon">↗</span><span>Markets</span>
            </button>
        </nav>

        <main id="main-view" aria-live="polite"></main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
